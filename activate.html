<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة AL BANA - تفعيل الحساب</title>
    <!-- استدعاء مكتبة فايربيس للنسخ الويب -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(17, 24, 39, 0.98);
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #3b82f6;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h2 { color: #60a5fa; margin-bottom: 10px; font-size: 1.5rem; }
        p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1f2937;
            border: 1px solid #4b5563;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #059669; }
        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #60a5fa;
            font-size: 0.9rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>منصة AL BANA التعليمية 🖤🔥</h2>
        <p>أدخل كود التفعيل الخاص بك لتفعيل اشتراكك الشهري</p>
        
        <input type="text" id="activationCode" placeholder="BANA-XXXXXXXX">
        <button onclick="activateAccount()">تفعيل الحساب والدخول 🚀</button>
        
        <div id="message"></div>

        <a href="index.html" class="back-link">الرجوع إلى التطبيق الرئيسي ↩️</a>
    </div>

    <script>
        // إعدادات ربط مشروعك في فايربيس (al-bana)
        const firebaseConfig = {
            projectId: "al-bana"
        };

        // تهيئة فايربيس
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function activateAccount() {
            const codeInput = document.getElementById('activationCode').value.trim();
            const messageDiv = document.getElementById('message');

            if (!codeInput) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "⚠️ الرجاء إدخال كود التفعيل أولاً!";
                return;
            }

            messageDiv.style.color = "#9ca3af";
            messageDiv.innerText = "⏳ جاري التحقق من الكود سحابياً...";

            try {
                const docRef = db.collection('activation_codes').doc(codeInput);
                const doc = await docRef.get();

                if (!doc.exists) {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = "❌ الكود غير صحيح أو غير موجود!";
                    return;
                }

                const data = doc.data();

                if (data.is_used) {
                    messageDiv.style.color = "orange";
                    messageDiv.innerText = "⚠️ هذا الكود مستخدم مسبقاً!";
                    return;
                }

                // تحديث حالة الكود في قاعدة البيانات لكي لا يُستخدم مرة أخرى
                await docRef.update({
                    is_used: true,
                    used_at: new Date().toISOString()
                });

                // حفظ وقت التفعيل وحالة فتح المنصة على المتصفح لمدة شهر كامل
                localStorage.setItem('albana_activation_time', new Date().getTime().toString());
                localStorage.setItem('albana_platform_unlocked', 'true');
                localStorage.setItem('albana_used_code', codeInput);

                messageDiv.style.color = "green";
                messageDiv.innerText = "🎉 تم تفعيل اشتراكك بنجاح يا GOAT! جاري توجيهك للمنصة...";

                // الانتقال التلقائي بعد ثانية ونصف لتطبيق AL BANA الرئيسي
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);

            } catch (error) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "❌ حدث خطأ في الاتصال، حاول مرة أخرى.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
